# SPDX-FileCopyrightText: 2025 The Linux Foundation

name: "🔍 Version Extract Action"
description: "Extract version strings from various software project types"
author: "The Linux Foundation"

inputs:
  path:
    description: "Path to search for project files or path to a specific file"
    required: false
    default: "."
  config:
    description: "Path to custom configuration file"
    required: false
    default: ""
  format:
    description: "Output format (text or json)"
    required: false
    default: "text"
  verbose:
    description: "Enable verbose output"
    required: false
    default: "false"
  fail-on-error:
    description: "Fail the action if version cannot be extracted"
    required: false
    default: "true"
  json_format:
    description: "JSON output format: pretty, minimised (default: pretty)"
    required: false
    default: "pretty"
  dynamic-fallback:
    description: "Enable dynamic versioning fallback to Git tags"
    required: false
    default: "true"

outputs:
  version:
    description: "Extracted version string"
    value: ${{ steps.extract.outputs.version }}
  project-type:
    description: "Detected project type"
    value: ${{ steps.extract.outputs.project-type }}
  subtype:
    description: "Project subtype (e.g., npm, gradle)"
    value: ${{ steps.extract.outputs.subtype }}
  file:
    description: "File where version was found"
    value: ${{ steps.extract.outputs.file }}
  success:
    description: "Whether version extraction was successful"
    value: ${{ steps.extract.outputs.success }}
  matched-by:
    description: "Regex pattern or method that matched the version"
    value: ${{ steps.extract.outputs.matched-by }}
  version-source:
    description: "Version source type (static or dynamic-git-tag)"
    value: ${{ steps.extract.outputs.version-source }}
  git-tag:
    description: "Original git tag (for dynamic versioning)"
    value: ${{ steps.extract.outputs.git-tag }}
  error:
    description: "Error message (when success=false)"
    value: ${{ steps.extract.outputs.error }}

runs:
  using: "composite"
  steps:
    - name: "Setup Go"
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
      with:
        # Newest supported release line; check-latest resolves its
        # newest patch rather than an older one cached on the runner.
        go-version: "1.27.x"
        check-latest: true
        cache: true

    - name: "Build version extract"
      shell: bash
      env:
        ACTION_PATH: "${{ github.action_path }}"
      run: |
        cd "$ACTION_PATH"
        echo "Building version extract..."
        go build -ldflags "-X main.version=action" \
          -o version-extract cmd/version-extract/main.go
        chmod +x version-extract

    - name: "Extract project version"
      id: extract
      shell: bash
      env:
        INPUT_PATH: "${{ inputs.path }}"
        INPUT_CONFIG: "${{ inputs.config }}"
        INPUT_FORMAT: "${{ inputs.format }}"
        INPUT_VERBOSE: "${{ inputs.verbose }}"
        INPUT_FAIL_ON_ERROR: "${{ inputs.fail-on-error }}"
        INPUT_JSON_FORMAT: "${{ inputs.json_format }}"
        INPUT_DYNAMIC_FALLBACK: "${{ inputs.dynamic-fallback }}"
        ACTION_PATH: "${{ github.action_path }}"
      run: |
        # Relative paths name the caller's workspace, not the action's
        # own directory, which this step runs from.
        SEARCH_PATH="$INPUT_PATH"
        CONFIG_PATH="$INPUT_CONFIG"
        case "$SEARCH_PATH" in
          /* | [A-Za-z]:[\\/]* | \\\\*) ;;
          *) SEARCH_PATH="${GITHUB_WORKSPACE}/${SEARCH_PATH}" ;;
        esac
        if [ -n "$CONFIG_PATH" ]; then
          case "$CONFIG_PATH" in
            /* | [A-Za-z]:[\\/]* | \\\\*) ;;
            *) CONFIG_PATH="${GITHUB_WORKSPACE}/${CONFIG_PATH}" ;;
          esac
        fi

        cd "$ACTION_PATH"

        # Set up parameters
        FORMAT="$INPUT_FORMAT"
        VERBOSE="$INPUT_VERBOSE"
        FAIL_ON_ERROR="$INPUT_FAIL_ON_ERROR"
        JSON_FORMAT="$INPUT_JSON_FORMAT"
        DYNAMIC_FALLBACK="$INPUT_DYNAMIC_FALLBACK"

        # Build command arguments using array
        ARGS=("--path=${SEARCH_PATH}" "--format=json")

        if [ -n "${CONFIG_PATH}" ]; then
          ARGS+=("--config=${CONFIG_PATH}")
        fi

        if [ "${VERBOSE}" = "true" ]; then
          ARGS+=("--verbose")
        fi

        if [ "${FAIL_ON_ERROR}" = "false" ]; then
          ARGS+=("--fail-on-error=false")
        fi

        if [ "${JSON_FORMAT}" != "pretty" ]; then
          ARGS+=("--json-format=${JSON_FORMAT}")
        fi

        if [ "${DYNAMIC_FALLBACK}" = "false" ]; then
          ARGS+=("--dynamic-fallback=false")
        fi

        echo "Running: ./version-extract ${ARGS[*]}"

        # Run the extractor once. With --format=json it writes the JSON
        # result to stdout and every diagnostic to stderr, so keep the
        # streams apart: stdout is parsed, stderr is kept for the log.
        STDERR_FILE=$(mktemp "${RUNNER_TEMP:-/tmp}/version-extract.XXXXXX")
        trap 'rm -f "${STDERR_FILE}"' EXIT

        set +e  # Don't exit on command failure
        OUTPUT=$(./version-extract "${ARGS[@]}" 2>"${STDERR_FILE}")
        EXTRACTOR_EXIT_CODE=$?
        set -e  # Re-enable exit on error

        if [ "${VERBOSE}" = "true" ]; then
          cat "${STDERR_FILE}"
        fi

        # Check if extraction was successful
        if [ ${EXTRACTOR_EXIT_CODE} -eq 0 ] && [ -n "${OUTPUT}" ]; then
          echo "Extractor succeeded"
          echo "${OUTPUT}"

          # Parse JSON output to extract all values
          VERSION=$(echo "${OUTPUT}" | jq -r '.version // ""' \
            2>/dev/null || echo "")
          PROJECT_TYPE=$(echo "${OUTPUT}" | jq -r '.project_type // ""' \
            2>/dev/null || echo "")
          SUBTYPE=$(echo "${OUTPUT}" | jq -r '.subtype // ""' \
            2>/dev/null || echo "")
          FILE_PATH=$(echo "${OUTPUT}" | jq -r '.file // ""' \
            2>/dev/null || echo "")
          SUCCESS=$(echo "${OUTPUT}" | jq -r '.success // false' \
            2>/dev/null || echo "false")
          MATCHED_BY=$(echo "${OUTPUT}" | jq -r '.matched_by // ""' \
            2>/dev/null || echo "")
          VERSION_SOURCE=$(echo "${OUTPUT}" | jq -r '.version_source // ""' \
            2>/dev/null || echo "")
          GIT_TAG=$(echo "${OUTPUT}" | jq -r '.git_tag // ""' \
            2>/dev/null || echo "")
          ERROR_MSG=$(echo "${OUTPUT}" | jq -r '.error // ""' \
            2>/dev/null || echo "")

          # Set all outputs
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "project-type=${PROJECT_TYPE}" >> "${GITHUB_OUTPUT}"
          echo "subtype=${SUBTYPE}" >> "${GITHUB_OUTPUT}"
          echo "file=${FILE_PATH}" >> "${GITHUB_OUTPUT}"
          echo "success=${SUCCESS}" >> "${GITHUB_OUTPUT}"
          echo "matched-by=${MATCHED_BY}" >> "${GITHUB_OUTPUT}"
          echo "version-source=${VERSION_SOURCE}" >> "${GITHUB_OUTPUT}"
          echo "git-tag=${GIT_TAG}" >> "${GITHUB_OUTPUT}"
          echo "error=${ERROR_MSG}" >> "${GITHUB_OUTPUT}"

          # Add to step summary
          echo "## 🔍 Version Extraction Results" >> \
            "${GITHUB_STEP_SUMMARY}"
          if [ "${SUCCESS}" = "true" ]; then
            echo "✅ **Success**: Version extracted successfully" >> \
              "${GITHUB_STEP_SUMMARY}"
            echo "- **Version**: \`${VERSION}\`" >> \
              "${GITHUB_STEP_SUMMARY}"
            echo "- **Project Type**: ${PROJECT_TYPE}" >> \
              "${GITHUB_STEP_SUMMARY}"
            if [ -n "${SUBTYPE}" ]; then
              echo "- **Subtype**: ${SUBTYPE}" >> \
                "${GITHUB_STEP_SUMMARY}"
            fi
            echo "- **Source File**: \`${FILE_PATH}\`" >> \
              "${GITHUB_STEP_SUMMARY}"
            if [ -n "${VERSION_SOURCE}" ]; then
              echo "- **Version Source**: ${VERSION_SOURCE}" >> \
                "${GITHUB_STEP_SUMMARY}"
            fi
            if [ -n "${GIT_TAG}" ]; then
              echo "- **Git Tag**: \`${GIT_TAG}\`" >> \
                "${GITHUB_STEP_SUMMARY}"
            fi
          else
            echo "❌ **Failed**: Could not extract version" >> \
              "${GITHUB_STEP_SUMMARY}"
          fi

        else
          # Extraction failed - report the stderr captured above, falling
          # back to stdout when the extractor wrote nothing to stderr
          ERROR_OUTPUT=$(cat "${STDERR_FILE}")
          if [ -z "${ERROR_OUTPUT}" ]; then
            ERROR_OUTPUT="${OUTPUT}"
          fi
          if [ "${VERBOSE}" != "true" ]; then
            echo "Extractor failed with output:"
            echo "${ERROR_OUTPUT}"
          else
            echo "Extractor failed"
          fi

          # Set failure outputs
          echo "version=" >> "${GITHUB_OUTPUT}"
          echo "project-type=" >> "${GITHUB_OUTPUT}"
          echo "subtype=" >> "${GITHUB_OUTPUT}"
          echo "file=" >> "${GITHUB_OUTPUT}"
          echo "success=false" >> "${GITHUB_OUTPUT}"
          echo "matched-by=" >> "${GITHUB_OUTPUT}"
          echo "version-source=" >> "${GITHUB_OUTPUT}"
          echo "git-tag=" >> "${GITHUB_OUTPUT}"
          echo "error=${ERROR_OUTPUT}" >> "${GITHUB_OUTPUT}"

          # Add failure to step summary
          echo "## 🔍 Version Extraction Results" >> \
            "${GITHUB_STEP_SUMMARY}"
          echo "❌ **Failed**: Version extraction failed" >> \
            "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
          echo "${ERROR_OUTPUT}" >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"

          if [ "${FAIL_ON_ERROR}" = "true" ]; then
            echo "::error::Version extraction failed: ${ERROR_OUTPUT}"
            exit 1
          else
            echo "::warning::Version extraction failed: ${ERROR_OUTPUT}"
          fi
        fi

branding:
  icon: "search"
  color: "blue"
