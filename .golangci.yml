# golangci-lint configuration, v2 schema, adopted from actions-template.
# Comments here record only where this repository deliberately differs.

version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - goconst
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - misspell
    - nakedret
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused

  settings:
    errcheck:
      check-blank: true
    gocyclo:
      min-complexity: 25
    govet:
      enable:
        - shadow
    # No 'locale' (the template sets US). This project writes British
    # English and exposes it in its interface: 'minimised' is a value of
    # --json-format. Unset, misspell still catches typos but enforces
    # neither spelling; 'UK' would instead flag Go and Git terms such as
    # 'Initialize' and 'normalize'.
    misspell: {}
    gosec:
      excludes:
        - G104

  exclusions:
    rules:
      # goconst is excluded from tests as well as gosec: test tables repeat
      # literal fixtures and expected values ("1.2.3", "static") on
      # purpose, and naming them would obscure what each case asserts.
      - path: "_test\\.go$"
        linters:
          - gosec
          - goconst

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
